name: Validate data model

on:
  push:
    paths:
      - "docs/data/**"
      - "tools/validate_data.py"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "docs/data/**"
      - "tools/validate_data.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate KingKira shared data model (schema v0.1)
        run: python3 tools/validate_data.py
